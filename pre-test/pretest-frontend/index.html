<!doctype html>
<!-- en-GB, not en: the portal presents itself as a British insurer, and the lang attribute is
     what a screen reader and some browsers' native date inputs read it from. Chrome picks a date
     input's format from the browser's own language rather than this, so it is a nudge, not a
     guarantee - the visible dd/mm/yyyy hint beside the field is what actually settles it. -->
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Salvena</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
