# Study configuration - the experiment hosting the portal: Qualtrics handover, voice bot, and the
# behavioural log's participant stamping. None of this is the portal's business; a different study
# replaces this file and leaves portal.properties alone.
#
# Imported from application.properties, so anything set there (or in the environment) still wins.

# Experiment 2 gets its OWN database, not just its own schema.
#
# It and levels-of-ai-help are two deployables built from the same portal library, and both name
# their study schema `behavioural`. Sharing one database would put two different `behavioural`
# schemas - different columns, different Flyway histories, different experiments - on a collision
# course: whichever migrated first would win, and the other would fail validation or, worse, read
# the wrong table. Separate databases on the same server keeps them independent while the two
# experiments run in the same window.
#
# portal.properties sets the datasource, and this file is imported after it, so this wins. The env
# var still beats both, which is what the Azure deployment uses.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/exp2_ai_human_handover}

# The study's own migrations: the behavioural schema, and nothing else. The portal migrates
# insurance_portal itself, with a separate Flyway instance and a separate history table, so the two
# version series are independent - both start at V1, and neither repository coordinates numbering
# with the other.
#
# These live here, not in application.properties, on purpose. portal.properties sets
# spring.flyway.enabled=false, and an imported document out-ranks the file that imports it, so the
# true in application.properties silently lost and Boot's Flyway never ran. application.properties
# imports portal.properties first and this file second, and the later import wins - so the true set
# here holds. It is also simply where these belong: they are the study's migrations.
spring.flyway.enabled=true
spring.flyway.schemas=behavioural
spring.flyway.default-schema=behavioural
spring.flyway.locations=classpath:db/migration/behavioural

# Verbose on the study's own code while the deployment is being hardened (dial down via
# APP_LOG_LEVEL=INFO). portal.properties sets the same level for the portal's package.
logging.level.solutions.andreas.study=${APP_LOG_LEVEL:DEBUG}

# The request's participantId (put in the MDC by ParticipantMdcFilter) is appended to every log
# line's level field, so one participant can be followed end-to-end through the Azure logs.
logging.pattern.level=%5p [pid:%X{participantId:-}]

# OpenAI Realtime (voice). Only the API key lives here (via env, never committed); the session
# config (model, voice, audio, per-level instructions, per-level tools) lives in the top-level
# configuration/ dir, read at runtime.
openai.api-key=${OPENAI_API_KEY:}

# Realtime API base URL the backend mints ephemeral tokens against (Azure Foundry v1 surface;
# override per environment via OPENAI_BASE_URL). The token endpoint is <base>/realtime/client_secrets.
openai.base-url=${OPENAI_BASE_URL:https://mtec-insurance-portal.openai.azure.com/openai/v1}

# Runtime configuration dir (filesystem): the voice config AND the participant task text, both read
# per request so they can be corrected without a rebuild. Native dev runs from
# exp2-app/, so ../configuration; Docker sets VOICE_CONFIG_DIR=/app/configuration.
#
# The env var keeps its old name deliberately - it is baked into the image (docker/Dockerfile) and
# renaming it would change the container's contract for no functional gain. The property is what
# the code reads, and it is no longer voice-specific.
app.config-dir=${VOICE_CONFIG_DIR:../configuration}

# Qualtrics handover: Qualtrics POSTs participantId/aiAck/humanAck/name/callbackUrl to
# /api/handover and gets a short-lived token; the portal exchanges ?t= on entry. The shared secret
# (X-Handover-Secret header) guards the register call when set - leave empty to disable the check
# (dev). ttl accepts a duration (e.g. 24h, 30m, PT6H) and bounds how long a token stays
# exchangeable.
app.handover.secret=${HANDOVER_SECRET:}
app.handover.ttl=${HANDOVER_TTL:24h}
