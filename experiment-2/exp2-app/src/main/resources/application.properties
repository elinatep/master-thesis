spring.application.name=insurance-portal

# Composition root. This application is the study hosting the portal, so it pulls in both
# configurations: portal.properties (the insurance app - datasource, schema, seeding) and
# study.properties (the experiment - handover, voice, participant log stamping).
#
# Precedence, the other way round from what you would expect: an imported document is inserted
# AFTER the document that imports it, so the import WINS over anything set below. (This cost us the
# behavioural schema once - spring.flyway.enabled=true here lost to portal.properties' false, Boot's
# Flyway never ran, and the app died on "missing table [behavioural.event]".) Only the environment
# and the command line beat an import. So: settings go in whichever of the two imported files they
# belong to, and the last import listed wins a tie between them.
spring.config.import=classpath:portal.properties,classpath:study.properties
